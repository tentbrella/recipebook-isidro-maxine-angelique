<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Recipe Book</title>
</head>
<body>
    <ul>
        <p>{{ recipe.name }}</p>
        <p>{{ recipe.author }}</p>
        <p>Ingredients:</p>
        <li>
        {%for ingredient in recipe.ingredients.all %}
        {{ ingredient.ingredient.name }}
        {% endfor %}
    </li>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Logout</button>
        </form>
    </ul>
</body>
</html>
