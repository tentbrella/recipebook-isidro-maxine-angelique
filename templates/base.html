<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Recipe Book</title>
</head>
<body>
    <ul>
        <p>{{ name }}</p>
        <p>Ingredients:</p>
        {% for ingredient in {{ name }}.ingredients.all %}
            {{ ingredient.ingredient.name }}
            {% endfor %}
    </ul>
</body>
</html>
