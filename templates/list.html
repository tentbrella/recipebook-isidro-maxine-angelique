<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Recipe Book</title>
</head>
<body>
    {% if request.user.is_authenticated %}
    <a href="/ledger/recipe/add">Create a recipe,</a> {{request.user.profile}}! 
    {% endif %}
    <ul>
        <p>Recipe List:</p>
        <p></p>
        {% for recipe in recipes %}
        <li><a href="/ledger/recipe/{{recipe.id}}/">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Logout</button>
    </form>
</body>
</html>
